<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カメラ視野チェッカー — リフレッシュスペース3F</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --ink: #1b2127; --muted: #5d6874; --line: #d8dee5;
    --accent: #0072B2; --overlap: #e0001b; --corridor: #d98a00; --r: 10px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; }
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 20px 4px; }
  h1 { margin: 0; font-size: 19px; font-weight: 700; }
  h1 .sub { font-weight: 500; color: var(--muted); margin-left: 10px; font-size: 14px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .lang button { border: 0; border-radius: 0; padding: 5px 12px; background: #fff; }
  .lang button.on { background: var(--accent); color: #fff; font-weight: 700; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  button:hover { border-color: #aab4be; background: #f6f8fa; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #00659d; }
  .lang button:hover { background: #eef3f7; } .lang button.on:hover { background: var(--accent); }

  .cambar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px 0; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 5px 5px 5px 10px; font-weight: 600; }
  .tab.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,114,178,.18); background: #f2f8fc; }
  .tab .x { margin-left: 2px; padding: 0 6px; border-radius: 5px; color: var(--muted); font-weight: 400; line-height: 1.25; }
  .tab .x:hover { background: #e3e9ef; color: var(--ink); }
  .chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px; flex: none; }
  .camtile { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 2px dashed #8fa0b0; border-radius: 9px;
             background: #f9fbfc; cursor: grab; user-select: none; font-weight: 600; }
  .camtile:hover { border-color: var(--accent); background: #f2f8fc; }
  .camtile:active { cursor: grabbing; }
  .hint { color: var(--muted); font-size: 12.5px; }

  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; padding: 10px 20px 8px; align-items: start; }
  @media (max-width: 1050px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  canvas { display: block; width: 100%; }
  #plan { touch-action: none; border-radius: 8px; background: #fff; }
  #view { border-radius: 8px; background: #1b2127; }
  .readout { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .planhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .planhead h2 { margin: 0; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seg label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
  .seg label:has(input:checked) { border-color: var(--accent); background: #f2f8fc; font-weight: 700; }
  .seg .lead { color: var(--muted); font-size: 12.5px; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 8px 0 6px; }
  .stat { border: 1px solid var(--line); border-radius: 7px; padding: 3px 7px; line-height: 1.2; min-width: 0; }
  .stat b { font-size: 13px; display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .stat b i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
  .stat small { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 11.5px; }
  .legend i { display: inline-block; width: 12px; height: 9px; margin-right: 4px; border-radius: 2px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.2); }
  details.opts { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 7px; }
  details.opts summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
  details.opts label.chk { display: flex; gap: 8px; align-items: center; margin: 6px 0 0; font-size: 13px; }
  details.opts .numrow { margin-top: 8px; }

  .ctlgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
  .ctlgrid label.num { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .ctlgrid label.num input, .numrow input { width: 92px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .sl label { display: flex; justify-content: space-between; font-size: 13px; }
  .sl output { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sl input[type=range] { width: 100%; margin: 2px 0 0; }
  .numrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }

  table.pp { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  table.pp td { padding: 4px 6px; border-top: 1px solid var(--line); }
  table.pp td:last-child { text-align: right; color: var(--muted); }
  .ok { color: #0a7a4b; font-weight: 600; } .no { color: #b3261e; font-weight: 600; } .part { color: #a35f00; font-weight: 600; }

  footer.foot { padding: 2px 20px 22px; color: #6b7581; font-size: 11.5px; line-height: 1.55; max-width: 1400px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1b2127; color: #fff;
           padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: .95; }
</style>
</head>
<body>
<header class="top">
  <h1><span data-i18n="title"></span><span class="sub" data-i18n="subtitle"></span></h1>
  <div class="actions">
    <div class="lang" role="group" aria-label="Language / 言語"><button id="langJa" data-lang="ja">日本語</button><button id="langEn" data-lang="en">English</button></div>
    <button class="primary" id="save" data-i18n="save"></button>
    <button id="copy" data-i18n="copy"></button>
  </div>
</header>

<div class="cambar">
  <div class="tabs" id="tabs"></div>
  <div class="camtile" id="tile" draggable="true" data-i18n-title="tileTitle">
    <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><rect x="1" y="4" width="17" height="12" rx="2.5" fill="#33414e"/><path d="M18 8.5l7-3.5v10l-7-3.5z" fill="#33414e"/><circle cx="9.5" cy="10" r="3" fill="#fff"/></svg>
    <span data-i18n="tileLabel"></span>
  </div>
  <button id="reset" data-i18n="reset"></button>
  <span class="hint" data-i18n="hint"></span>
</div>

<main>
  <section>
    <div class="card">
      <h2 data-i18n="viewTitle"></h2>
      <canvas id="view"></canvas>
      <div class="readout" data-i18n="viewKey"></div>
    </div>

    <div class="card" id="ctl">
      <h2 id="ctlTitle"></h2>
      <div class="ctlgrid">
        <label class="num"><span data-i18n="fx"></span><input id="fx" type="number" step="0.1"></label>
        <label class="num"><span data-i18n="fy"></span><input id="fy" type="number" step="0.1"></label>
        <div class="sl"><label for="fh"><span data-i18n="fh"></span><output id="oh"></output></label><input id="fh" type="range" min="1.5" max="4" step="0.1"></div>
        <div class="sl"><label for="fyaw"><span data-i18n="fyaw"></span><output id="oyaw"></output></label><input id="fyaw" type="range" min="0" max="359" step="1"></div>
        <div class="sl"><label for="fpitch"><span data-i18n="fpitch"></span><output id="opitch"></output></label><input id="fpitch" type="range" min="0" max="85" step="1"></div>
        <div class="sl"><label for="fzoom"><span data-i18n="fzoom"></span><output id="ozoom"></output></label><input id="fzoom" type="range" min="1" max="2" step="0.1"></div>
      </div>
      <div class="readout" id="camReadout"></div>
      <div class="readout" data-i18n="ctlHint"></div>
    </div>

    <div class="card">
      <h2 data-i18n="personTitle"></h2>
      <div class="seg">
        <label><input type="radio" name="posture" value="sitting" checked><span data-i18n="sitting"></span></label>
        <label><input type="radio" name="posture" value="standing"><span data-i18n="standing"></span></label>
        <span class="lead" data-i18n="pinHint"></span>
      </div>
      <table class="pp" id="pp"></table>
    </div>
  </section>

  <aside>
    <div class="card">
      <div class="planhead">
        <h2 data-i18n="planTitle"></h2>
        <div class="seg">
          <span class="lead" data-i18n="coverageAt"></span>
          <label><input type="radio" name="plane" value="0"><span data-i18n="planeFloor"></span></label>
          <label><input type="radio" name="plane" value="1050" checked><span data-i18n="planeSeated"></span></label>
          <label><input type="radio" name="plane" value="1400"><span data-i18n="planeStanding"></span></label>
        </div>
      </div>
      <canvas id="plan"></canvas>
      <div class="stats" id="stats"></div>
      <div class="legend" id="legend"></div>
      <details class="opts">
        <summary data-i18n="optTitle"></summary>
        <label class="chk"><input type="checkbox" id="oSolid" checked><span data-i18n="optSolid"></span></label>
        <label class="chk"><input type="checkbox" id="oGaps" checked><span data-i18n="optGaps"></span></label>
        <label class="chk"><input type="checkbox" id="oSnap" checked><span data-i18n="optSnap"></span></label>
        <div class="numrow"><span data-i18n="optWall"></span><input id="fwall" type="number" step="0.1" min="2" max="5" value="2.7"></div>
      </details>
    </div>
  </aside>
</main>

<footer class="foot" id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const D2R = Math.PI / 180;

// =====================================================================================================
// Words. Japanese first; English by the toggle. Add a key to both tables when adding any text.
// =====================================================================================================
const I18N = {
  ja: {
    docTitle: 'カメラ視野チェッカー — リフレッシュスペース3F', title: 'カメラ視野チェッカー', subtitle: 'リフレッシュスペース・3階',
    save: '画像を保存', copy: '位置をコピー', reset: '提案位置に戻す',
    tileLabel: 'カメラを平面図へドラッグ', tileTitle: 'ドラッグで平面図に配置（クリックでも追加できます）',
    hint: '配置 → 丸をドラッグで移動、白いリングで向きを調整 → 左の映像で見え方を確認',
    viewTitle: '選択中のカメラに映るもの',
    viewKey: '緑＝床の1mグリッド／黄褐色＝テーブル／青＝ブース／灰＝壁・ソファ・固定什器／琥珀色＝廊下の床／橙＝Pピンの人',
    planTitle: '平面図（真上から）', coverageAt: '視野を見る高さ',
    planeFloor: '床面', planeSeated: '座位の胸', planeStanding: '立位の胸',
    ctlTitle: n => `CAM ${n}：位置と向き`, ctlNone: 'カメラが選択されていません',
    fx: '5通りから (m)', fy: 'C通り壁から (m)', fh: '取付高さ', fyaw: '向き', fpitch: '下向き角', fzoom: 'ズーム',
    ctlHint: '向き 90°＝室内へ真っ直ぐ／下向き角 0°＝水平、90°＝真下／ズームはソフトウェアズーム（範囲は非公開）',
    camReadout: (h, v, a) => `視野：横${h}°×縦${v}°。この高さで室内の ${a} m² を撮影。`,
    personTitle: 'テスト位置（Pピン）', sitting: '座っている人', standing: '立っている人',
    pinHint: '平面図の黒い「P」をドラッグして位置を試せます',
    resIn: '視野内', resOut: '視野外', resPart: '一部見切れ', dist: d => `${d} m先`, tall: p => `高さ ${p}px`, noCams: 'カメラを追加してください',
    stat1: '1台で見える', stat2: '2台以上（重複）', stat3: '見えない', stat4: '廊下が映る',
    legTable: 'テーブル', legBooth: 'ブース', legOther: 'ソファ・固定什器', legWall: '壁・柱', legOpen: '壁なし（廊下に開放）',
    optTitle: 'オプション', optSolid: '壁と家具が視界をさえぎる', optGaps: '見えない範囲を表示',
    optSnap: 'C通り壁の近くにドロップしたら壁に吸着', optWall: '壁の高さ (m)',
    cvCorridor: '廊下', cvOpen: '壁なし：廊下に開放', cvWall: 'C通り壁（窓）',
    tSaved: '画像を保存しました', tCopied: '位置をコピーしました', tReset: '提案位置に戻しました', tMax: 'カメラは8台までです',
    remove: '削除',
    bay: x => x < 0 ? '5通りより西' : x > 18000 ? '8通りより東' : `${5 + Math.min(2, Math.floor(x / 6000))}〜${6 + Math.min(2, Math.floor(x / 6000))}通り間`,
    describe: c => `CAM ${c.n}：5通りから${(c.x / 1000).toFixed(1)}m（${I18N.ja.bay(c.x)}）／C通りから${(c.y / 1000).toFixed(2)}m／高さ${(c.h / 1000).toFixed(1)}m／向き${Math.round(c.yaw)}°／下向き${Math.round(c.pitch)}°／ズーム${c.zoom.toFixed(1)}`,
    foot: '縮尺：図面上で柱の間隔が6.0m（A3で1/100）になっていることから算出しています。5通りと6通りの柱芯間をメジャーで測って確認してください。壁・テーブル・ブースは図面から読み取った値で、誤差は約±0.2mです。カメラの高さと壁の高さ（2.7m）は図面に無いため仮定です。レンズ：Logitech C922（メーカー公称：対角78°・水平70.42°・垂直43.3°）を1920×1080の映像として計算しており、実機での実測はまだ行っていません。壁と家具は視界をさえぎるものとして扱い、人は座位・立位とも胸の高さで判定しています。',
  },
  en: {
    docTitle: 'Camera coverage — Refresh Space 3F', title: 'Camera coverage', subtitle: 'Refresh Space · 3F',
    save: 'Save picture', copy: 'Copy positions', reset: 'Reset to proposed',
    tileLabel: 'Drag a camera onto the plan', tileTitle: 'Drag onto the plan to place it (or click to add)',
    hint: 'Place it, move it by its dot, turn it with the white ring, then check the view on the left',
    viewTitle: 'What the selected camera sees',
    viewKey: 'Green: 1 m floor grid · tan: tables · blue: booths · grey: walls, sofa, fixed units · amber: corridor floor · orange: the person pin',
    planTitle: 'Floor plan (top-down)', coverageAt: 'Coverage shown at',
    planeFloor: 'Floor', planeSeated: 'Seated chest', planeStanding: 'Standing chest',
    ctlTitle: n => `CAM ${n}: position and aim`, ctlNone: 'No camera selected',
    fx: 'From column 5 (m)', fy: 'From C-line wall (m)', fh: 'Mounting height', fyaw: 'Direction', fpitch: 'Tilt down', fzoom: 'Zoom',
    ctlHint: 'Direction 90° = straight across the room · Tilt 0° = level, 90° = straight down · Zoom is software zoom (range not published)',
    camReadout: (h, v, a) => `Sees ${h}° wide × ${v}° tall; ${a} m² of the room at this height.`,

    legTable: 'Table', legBooth: 'Booth', legOther: 'Sofa / fixed units', legWall: 'Wall / column', legOpen: 'Open to corridor',
    optTitle: 'Options', optSolid: 'Walls and furniture block the view', optGaps: 'Show gaps',
    optSnap: 'Snap to the C-line wall when dropped near it', optWall: 'Wall height (m)',
    cvCorridor: 'CORRIDOR', cvOpen: 'no wall here: open to the corridor', cvWall: 'C-line wall (windows)',
    tSaved: 'Picture saved', tCopied: 'Positions copied', tReset: 'Back to the proposed positions', tMax: 'Eight cameras is the limit here',
    remove: 'Remove',
    bay: x => x < 0 ? 'west of column 5' : x > 18000 ? 'east of column 8' : `bay ${5 + Math.min(2, Math.floor(x / 6000))}–${6 + Math.min(2, Math.floor(x / 6000))}`,
    describe: c => `CAM ${c.n}: ${(c.x / 1000).toFixed(1)} m from column 5 (${I18N.en.bay(c.x)}) · ${(c.y / 1000).toFixed(2)} m out from the C line · height ${(c.h / 1000).toFixed(1)} m · facing ${Math.round(c.yaw)}° · tilt ${Math.round(c.pitch)}° down · zoom ${c.zoom.toFixed(1)}`,
    foot: 'Scale comes from the drawing, where the columns are 6.0 m apart (1/100 on A3). Tape one bay, column centre to column centre, to confirm. Walls, tables and booths are read off the drawing to about ±0.2 m. Camera height and wall height (2.7 m) are assumptions, since a floor plan has no heights. Lens: Logitech C922 (Logitech lists 78° diagonal, 70.42° wide, 43.3° tall), used for a 1920×1080 picture; not yet measured on a real unit. Walls and furniture are treated as solid and block the view; people are judged at chest height, seated or standing.',
  },
};
let lang = 'ja';
const t = (k, ...a) => { const v = (I18N[lang] && I18N[lang][k] !== undefined) ? I18N[lang][k] : I18N.en[k]; return typeof v === 'function' ? v(...a) : v; };

// =====================================================================================================
// The room, in millimetres. Origin = centre of the 5/C column, X along the C-line wall, Y into the room.
// Read off the 3F layout drawing (the drawing itself is not part of this tool). Columns are 6,000 mm apart.
// =====================================================================================================
const ROOM = { x0: 700, x1: 17800, y0: 260, y1: 6100 };       // inside faces of the walls
const CORR_Y1 = 8000;                                          // far side of the corridor
const WALL_Y = 260;                                            // room-side face of the C-line wall
const NORTH_WALL_X0 = 10820;                                   // the north wall starts here; to the west the room is open to the corridor
const COLS_X = [0, 6000, 12000, 18000], COL_NAMES = ['5', '6', '7', '8'];

const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
const circle = (cx, cy, r) => Array.from({ length: 16 }, (_, i) => [cx + r * Math.cos(i * Math.PI / 8), cy + r * Math.sin(i * Math.PI / 8)]);
const WALLS = [                                                // walls, full height
  { p: rect(560, -100, 17940, 120), k: 'wall' },               // C-line wall (windows)
  { p: rect(560, -100, 700, 6100), k: 'wall' },                // west wall
  { p: rect(17800, -100, 17940, 6300), k: 'wall' },            // east wall
  { p: rect(5930, 120, 6130, 6120), k: 'partition' },          // the partition between the corner and the main space
  { p: rect(NORTH_WALL_X0, 6100, 17940, 6300), k: 'wall' },    // north wall with the whiteboard
  ...COLS_X.map(cx => ({ p: rect(cx - 500, -240, cx + 500, 270), k: 'column' })),
];
const FURN = [                                                 // h = height in mm
  { k: 'table', h: 720,  p: rect(700, 2710, 1560, 3320) },     // H720 desks
  { k: 'table', h: 720,  p: rect(700, 1120, 1560, 1730) },
  { k: 'table', h: 550,  p: circle(2780, 500, 375) },          // round low tables
  { k: 'table', h: 550,  p: circle(3830, 500, 375) },
  { k: 'table', h: 550,  p: circle(4880, 500, 375) },
  { k: 'table', h: 620,  p: rect(4030, 3020, 4930, 5120) },    // the long table in the corner
  { k: 'table', h: 720,  p: rect(7340, 4450, 8240, 5370) },    // AnyWay pair, north
  { k: 'table', h: 720,  p: rect(8240, 4450, 9160, 5370) },
  { k: 'table', h: 720,  p: rect(7380, 1160, 9480, 2200) },    // SENTIR long tables
  { k: 'table', h: 720,  p: rect(9480, 1160, 11580, 2200) },
  { k: 'table', h: 720,  p: rect(12420, 1960, 13320, 2850) },  // AnyWay pair, east
  { k: 'table', h: 720,  p: rect(13320, 1960, 14220, 2850) },
  { k: 'table', h: 1000, p: [[14188, 5264], [14924, 5406], [15168, 3944], [14431, 3802]] },   // tilted high table
  { k: 'table', h: 1000, p: rect(12490, 120, 16070, 570) },    // counter along the windows
  { k: 'booth', h: 2200, p: rect(16750, 4600, 17800, 5700) },  // the four WORKPODs
  { k: 'booth', h: 2200, p: rect(16750, 3510, 17800, 4530) },
  { k: 'booth', h: 2200, p: rect(16750, 2360, 17800, 3450) },
  { k: 'booth', h: 2200, p: rect(16750, 1240, 17800, 2300) },
  { k: 'other', h: 800,  p: rect(3130, 5410, 5940, 6120) },    // L-shaped sofa

  }

  for (let gy = ROOM.y1 + 900; gy <= CORR_Y1; gy += 1000) seg([ROOM.x0, gy, 0], [ROOM.x1, gy, 0], 'rgba(245,158,11,.30)', 1);
  seg([ROOM.x0, ROOM.y1, 0], [NORTH_WALL_X0, ROOM.y1, 0], 'rgba(255,200,90,.95)', 1.8, [7, 5]);   // the open edge
  // solid objects, farthest first
  const solids = [];
  SOL.forEach(s => splitLong(s, 1200).forEach(p => solids.push(p)));
  const H = BODY[S.posture], px = person.x, py = person.y;     // the person: a body and a head
  solids.push({ poly: ccw(rect(px - 225, py - 150, px + 225, py + 150)), z0: 0, z1: H - 260, k: 'person', bb: { x0: px - 225, x1: px + 225, y0: py - 150, y1: py + 150 } });
  solids.push({ poly: ccw(rect(px - 105, py - 105, px + 105, py + 105)), z0: H - 260, z1: H - 20, k: 'person', bb: { x0: px - 105, x1: px + 105, y0: py - 105, y1: py + 105 } });
  solids.forEach(s => { s.dist = (((s.bb.x0 + s.bb.x1) / 2 - c.x) ** 2 + ((s.bb.y0 + s.bb.y1) / 2 - c.y) ** 2 + ((s.z0 + s.z1) / 2 - c.h) ** 2); });
  solids.sort((a, b) => b.dist - a.dist);
  const shade = (rgb, n) => { const l = 0.5 + 0.5 * Math.max(0, dot(n, LIGHT)); return `rgb(${rgb[0] * l | 0},${rgb[1] * l | 0},${rgb[2] * l | 0})`; };
  solids.forEach(s => {
    const rgb = VIEW_RGB[s.k], edge = (s.k === 'wall' || s.k === 'partition') ? null : 'rgba(0,0,0,.4)', p = s.poly;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], ex = b[0] - a[0], ey = b[1] - a[1], len = Math.hypot(ex, ey) || 1;
      const n = [ey / len, -ex / len, 0], mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (s.z0 + s.z1) / 2];
      if (dot(n, [camPos[0] - mid[0], camPos[1] - mid[1], camPos[2] - mid[2]]) <= 0) continue;     // facing away
      const fill = shade(rgb, n);
      fillPoly([cs(a[0], a[1], s.z0), cs(b[0], b[1], s.z0), cs(b[0], b[1], s.z1), cs(a[0], a[1], s.z1)], fill, edge || fill);
    }
    if (c.h > s.z1) { const fill = shade(rgb, [0, 0, 1]); fillPoly(p.map(q => cs(q[0], q[1], s.z1)), fill, edge || fill); }   // the top
  });
  vctx.restore();
  vctx.fillStyle = 'rgba(255,255,255,.82)'; vctx.font = '600 13px system-ui'; vctx.textAlign = 'left';
  vctx.fillText(`CAM ${c.n} · 16:9 · ${(2 * Math.atan(c.tanH) / D2R).toFixed(0)}° × ${(2 * Math.atan(c.tanV) / D2R).toFixed(0)}°`, 10, 16);
}

// =====================================================================================================
// Readouts and controls
// =====================================================================================================
const m2 = n => (n * CELL * CELL / 1e6);
const bay = x => t('bay', x);
function drawStats(cov) {
  const tile = (col, v, label) => `<div class="stat"><b><i style="background:${col}"></i>${v} m²</b><small title="${label}">${label}</small></div>`;
  $('stats').innerHTML = tile('#2a6f9b', m2(cov.c1).toFixed(1), t('stat1')) + tile('#e0001b', m2(cov.c2).toFixed(1), t('stat2')) +
                         tile('#7b8794', m2(cov.c0).toFixed(1), t('stat3')) + tile('#d98a00', m2(cov.spill).toFixed(1), t('stat4'));
}
function drawLegend() {
  const sw = (bg, label) => `<span><i style="background:${bg}"></i>${label}</span>`;
  $('legend').innerHTML = sw('#efd9a8', t('legTable')) + sw('#bcd9ee', t('legBooth')) + sw('#dde2e8', t('legOther')) +
    sw('#2f3a45', t('legWall')) + sw('repeating-linear-gradient(90deg,#2f3a45 0 4px,#fff 4px 7px)', t('legOpen'));
}
function updateReadouts(cov) {
  const c = sel();
  $('ctl').style.opacity = c ? 1 : .45;
  $('ctlTitle').textContent = c ? t('ctlTitle', c.n) : t('ctlNone');
  if (c) {
    const i = cams.indexOf(c);
    $('oh').textContent = (c.h / 1000).toFixed(1) + ' m'; $('oyaw').textContent = Math.round(c.yaw) + '°';
    $('opitch').textContent = Math.round(c.pitch) + '°'; $('ozoom').textContent = c.zoom.toFixed(1) + '×';
    $('camReadout').textContent = t('camReadout', (2 * Math.atan(c.tanH) / D2R).toFixed(0), (2 * Math.atan(c.tanV) / D2R).toFixed(0), m2(cov.per[i]).toFixed(1));
  } else $('camReadout').textContent = '';
  const chest = CHEST[S.posture], rows = cams.map(kc => {
    const dist = Math.hypot(person.x - kc.x, person.y - kc.y, chest - kc.h) / 1000;
    let tail = '—', cls = 'no', word = t('resOut');
    if (sees(kc, person.x, person.y, chest)) {
      const b = toCam(kc, person.x, person.y, 0), tp = toCam(kc, person.x, person.y, BODY[S.posture]);
      if (b[2] > 50 && tp[2] > 50) {
        const yb = (1 - b[1] / (b[2] * kc.tanV)) / 2 * 1080, yt = (1 - tp[1] / (tp[2] * kc.tanV)) / 2 * 1080;
        tail = t('tall', Math.round(Math.abs(yb - yt)));
        if (yb > 1080 || yt < 0) { cls = 'part'; word = t('resPart'); } else { cls = 'ok'; word = t('resIn'); }
      } else { cls = 'part'; word = t('resIn'); }
    }
    return `<tr><td><span class="chip" style="background:${colourOf(kc)};width:20px;height:20px;font-size:11px">${kc.n}</span></td><td class="${cls}">${word}</td><td>${t('dist', dist.toFixed(1))}</td><td>${tail}</td></tr>`;
  });
  $('pp').innerHTML = rows.length ? rows.join('') : `<tr><td>${t('noCams')}</td></tr>`;
}
function renderTabs() {
  $('tabs').innerHTML = cams.map(c => `<button class="tab ${c.n === selN ? 'sel' : ''}" data-n="${c.n}"><span class="chip" style="background:${colourOf(c)}">${c.n}</span>CAM ${c.n}<span class="x" data-del="${c.n}" title="${t('remove')}">×</span></button>`).join('');
}
function syncInputs() {
  const c = sel(); if (!c) return;
  $('fx').value = (c.x / 1000).toFixed(2); $('fy').value = (c.y / 1000).toFixed(2);
  $('fh').value = c.h / 1000; $('fyaw').value = Math.round(c.yaw) % 360; $('fpitch').value = c.pitch; $('fzoom').value = c.zoom;
}
function refresh(o = {}) {
  cams.forEach(prep);
  const cov = computeCoverage(o.fast ? 2 : 1);
  drawPlan(cov); drawStats(cov); drawView(); updateReadouts(cov);
  if (o.list) renderTabs();
  if (o.sync) syncInputs();
  save();
}
function applyLang() {
  document.documentElement.lang = lang; document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $('foot').textContent = t('foot');
  $('langJa').classList.toggle('on', lang === 'ja'); $('langEn').classList.toggle('on', lang === 'en');
  drawLegend(); refresh({ list: true, sync: true });
}

// =====================================================================================================
// Adding, moving, turning
// =====================================================================================================
const clampPt = (x, y) => [Math.max(ROOM.x0 - 400, Math.min(ROOM.x1 + 400, x)), Math.max(-300, Math.min(CORR_Y1, y))];
function place(c, x, y) {
  [x, y] = clampPt(x, y);
  if (S.snap && Math.abs(y - WALL_Y) < 450) y = WALL_Y;
  c.x = Math.round(x); c.y = Math.round(y);
}
function addCamera(x, y) {
  if (cams.length >= 8) { toast(t('tMax')); return; }
  let n = 1; while (cams.some(c => c.n === n)) n++;
  const c = { n, x: 0, y: 0, h: 2700, yaw: 90, pitch: 35, zoom: 1 };
  if (x === undefined) {                                        // a click on the tile: first free spot along the wall
    const spots = [3000, 9000, 15000, 6000, 12000, 1500, 7500, 13500, 10500, 4500]; x = spots.find(sx => !cams.some(o => Math.abs(o.x - sx) < 1200 && o.y < 600)) || 9000; y = WALL_Y;
  }
  place(c, x, y);
  c.yaw = c.y < 3000 ? 90 : 270;
  cams.push(c); cams.sort((a, b) => a.n - b.n); selN = n;
  refresh({ list: true, sync: true });
}
function hit(px, py) {
  const c = sel();
  if (c) { const a = c.yaw * D2R; if (Math.hypot(px - X(c.x + Math.cos(a) * AIM_MM), py - Y(c.y + Math.sin(a) * AIM_MM)) <= 11) return { t: 'aim', c }; }
  if (Math.hypot(px - X(person.x), py - Y(person.y)) <= 11) return { t: 'person' };
  for (let i = cams.length - 1; i >= 0; i--) if (Math.hypot(px - X(cams[i].x), py - Y(cams[i].y)) <= 14) return { t: 'cam', c: cams[i] };
  return null;
}
let drag = null;
const local = e => { const r = planCv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
planCv.addEventListener('pointerdown', e => {
  const [px, py] = local(e), h = hit(px, py); if (!h) return;
  drag = h; try { planCv.setPointerCapture(e.pointerId); } catch (err) { /* the drag still works without capture */ }
  if (h.t === 'cam') { selN = h.c.n; refresh({ list: true, sync: true }); }
});
planCv.addEventListener('pointermove', e => {
  const [px, py] = local(e);
  if (!drag) { const h = hit(px, py); planCv.style.cursor = h ? (h.t === 'aim' ? 'crosshair' : 'grab') : 'default'; return; }
  planCv.style.cursor = drag.t === 'aim' ? 'crosshair' : 'grabbing';
  const mx = mmX(px), my = mmY(py);
  if (drag.t === 'cam') place(drag.c, mx, my);
  else if (drag.t === 'person') { [person.x, person.y] = clampPt(mx, my); person.x = Math.round(person.x); person.y = Math.round(person.y); }
  else if (drag.t === 'aim') {
    let yaw = Math.atan2(my - drag.c.y, mx - drag.c.x) / D2R; if (yaw < 0) yaw += 360;
    drag.c.yaw = e.shiftKey ? Math.round(yaw / 15) * 15 % 360 : Math.round(yaw) % 360;
  }
  refresh({ sync: drag.t !== 'person', fast: true });
});
const endDrag = () => { if (drag) { drag = null; refresh({ list: true }); } };
planCv.addEventListener('pointerup', endDrag); planCv.addEventListener('pointercancel', endDrag);

$('tile').addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'camera'); e.dataTransfer.effectAllowed = 'copy'; });
$('tile').addEventListener('click', () => addCamera());
planCv.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
planCv.addEventListener('drop', e => { e.preventDefault(); const [px, py] = local(e); addCamera(mmX(px), mmY(py)); });
$('reset').addEventListener('click', () => { cams = PROPOSED(); selN = 1; refresh({ list: true, sync: true }); toast(t('tReset')); });
$('tabs').addEventListener('click', e => {
  const del = e.target.closest('[data-del]'), pick = e.target.closest('[data-n]');
  if (del) { cams = cams.filter(c => c.n !== +del.dataset.del); if (!sel()) selN = cams.length ? cams[0].n : 0; refresh({ list: true, sync: true }); }
  else if (pick) { selN = +pick.dataset.n; refresh({ list: true, sync: true }); }
});
const bind = (id, fn) => $(id).addEventListener('input', () => { const c = sel(); if (!c) return; fn(c, parseFloat($(id).value)); refresh({ list: id === 'fx' }); });
bind('fx', (c, v) => { if (!isNaN(v)) c.x = Math.round(v * 1000); });
bind('fy', (c, v) => { if (!isNaN(v)) c.y = Math.round(v * 1000); });
bind('fh', (c, v) => { c.h = Math.round(v * 1000); });
bind('fyaw', (c, v) => { c.yaw = v; });
bind('fpitch', (c, v) => { c.pitch = v; });
bind('fzoom', (c, v) => { c.zoom = v; });
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const c = sel(); if (!c) return;
  const step = e.shiftKey ? 500 : 100;
  if (e.key === 'Delete' || e.key === 'Backspace') { cams = cams.filter(q => q !== c); selN = cams.length ? cams[0].n : 0; refresh({ list: true, sync: true }); }
  else if (e.key.startsWith('Arrow')) {
    e.preventDefault(); place(c, c.x + (e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0), c.y + (e.key === 'ArrowUp' ? step : e.key === 'ArrowDown' ? -step : 0));
    refresh({ list: true, sync: true });
  }
});
document.querySelectorAll('input[name=plane]').forEach(r => r.addEventListener('change', () => { S.plane = +r.value; refresh(); }));
document.querySelectorAll('input[name=posture]').forEach(r => r.addEventListener('change', () => { S.posture = r.value; refresh(); }));
$('oSolid').addEventListener('change', () => { S.solid = $('oSolid').checked; refresh(); });
$('oGaps').addEventListener('change', () => { S.showGaps = $('oGaps').checked; refresh(); });
$('oSnap').addEventListener('change', () => { S.snap = $('oSnap').checked; save(); });
$('fwall').addEventListener('input', () => { const v = parseFloat($('fwall').value); if (v >= 2) { S.wallH = Math.round(v * 1000); buildSolids(); refresh(); } });
$('langJa').addEventListener('click', () => { lang = 'ja'; applyLang(); });
$('langEn').addEventListener('click', () => { lang = 'en'; applyLang(); });

function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
$('save').addEventListener('click', () => {
  planCv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'camera-coverage-plan.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast(t('tSaved')); });
});
$('copy').addEventListener('click', async () => {
  const text = cams.map(c => t('describe', c)).join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('tCopied'));
});

// start
$('oSolid').checked = S.solid; $('oGaps').checked = S.showGaps; $('oSnap').checked = S.snap; $('fwall').value = S.wallH / 1000;
document.querySelectorAll('input[name=plane]').forEach(r => { r.checked = (+r.value === S.plane); });
document.querySelectorAll('input[name=posture]').forEach(r => { r.checked = (r.value === S.posture); });
if (!sel() && cams.length) selN = cams[0].n;
buildSolids();
new ResizeObserver(() => { sizePlan(); refresh(); }).observe(planCv.parentElement);
new ResizeObserver(() => refresh()).observe(viewCv.parentElement);
sizePlan(); applyLang();
window.__tool = { get cams() { return cams; }, get S() { return S; }, get lang() { return lang; }, refresh, addCamera, computeCoverage, applyLang, setLang(l) { lang = l; applyLang(); }, buildSolids };   // for testing
})();
</script>
</body>
